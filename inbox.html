<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox — Kaidostar</title>
<link rel="stylesheet" href="styles.css">
<style>
.inbox-list{ max-width: 680px; }
.inbox-item{ display:flex; gap:16px; padding: 18px 0; border-bottom: 1px solid var(--line-soft); }
.inbox-item-unread{ background: var(--gold-dim); margin: 0 -20px; padding: 18px 20px; border-radius: 8px; }
.inbox-unread-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--gold); margin-left:6px; vertical-align:2px; }
.inbox-item:last-child{ border-bottom:none; }
.inbox-icon{ width:36px; height:36px; border-radius:8px; background: var(--panel-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size: 15px; color: var(--gold); }
.inbox-title{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size: 14.5px; margin:0 0 3px; }
.inbox-detail{ font-family:'Manrope', sans-serif; font-size: 13px; color: var(--text-dim); line-height:1.5; }
.inbox-ts{ font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-faint); margin-top:6px; }

.toggle-switch{ position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle-switch input{ opacity: 0; width: 0; height: 0; }
.toggle-slider{ position: absolute; cursor: pointer; inset: 0; background: var(--line); border-radius: 999px; transition: all .2s ease; }
.toggle-slider::before{ content: ''; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px; background: var(--text); border-radius: 50%; transition: all .2s ease; }
.toggle-switch input:checked + .toggle-slider{ background: linear-gradient(135deg, #F7C878, #EAA23C); }
.toggle-switch input:checked + .toggle-slider::before{ transform: translateX(20px); background: #241704; }
.notif-pref-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line-soft); }
.notif-pref-row:last-child{ border-bottom:none; }
.notif-pref-label{ font-family:'Manrope', sans-serif; font-size:13.5px; color:var(--text); }
</style>
</head>
<body>

<div id="nav-root"></div>

<div class="wrap">
  <div class="page">
    <div class="page-head">
      <div class="eyebrow">Inbox</div>
      <h1>What moved while you were away</h1>
      <p>Everything the watch has found - new matches and scan activity, newest first.</p>
    </div>

    <div id="inboxActions" class="hidden" style="margin-bottom:14px;"><button class="btn ghost" id="clearInboxBtn">Clear all</button></div>
    <div class="panel inbox-list" id="inboxPanel"></div>

    <div class="panel" style="margin-top:20px; padding:20px 22px;">
      <h3 style="font-family:'Space Grotesk',sans-serif; margin:0 0 4px;">Notification settings</h3>
      <p style="font-family:'Manrope',sans-serif; font-size:12.5px; color:var(--text-faint); margin:0 0 4px;">Choose exactly which kinds of activity you want to hear about.</p>
      <div id="notifPrefsList"></div>
    </div>
  </div>
  <footer>Kaidostar is a demo - listings shown are illustrative, not live postings.</footer>
</div>

<script src="api.js"></script>
<script src="state.js"></script>
<script>
window.addEventListener("error", function(e){
  var msg = "Script error: " + e.message + " (in " + (e.filename ? e.filename.split("/").pop() : "unknown file") + ", line " + e.lineno + ")";
  showDiagBanner(msg);
});
function showDiagBanner(msg){
  if(document.getElementById("diagBanner")) return;
  var b = document.createElement("div");
  b.id = "diagBanner";
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;padding:14px 20px;font-family:monospace;font-size:13px;text-align:center;";
  b.textContent = "Kaidostar failed to load correctly - " + msg + " - check that all files (especially state.js and styles.css) are uploaded with these EXACT lowercase names to the same folder.";
  document.body.prepend(b);
}
setTimeout(function(){
  if(typeof renderNav === "undefined" || typeof kaidostarMark === "undefined"){
    showDiagBanner("state.js did not load (its functions are undefined). Check the file exists, is named exactly state.js, and sits in the same folder as this page.");
  }
}, 800);
</script>
<script>
renderNav('inbox');

const panel = document.getElementById('inboxPanel');
const actionsRow = document.getElementById('inboxActions');

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function renderInbox(){
  const notes = getNotifications();
  actionsRow.classList.toggle('hidden', notes.length === 0);
  if(notes.length === 0){
    panel.innerHTML = `<div class="empty-state">
      <div class="glyph">✦</div>
      Nothing here yet.
      <div class="sub">Start the watch on the Job Search page - new matches will show up here as they're found.</div>
      <a class="btn" href="dashboard.html">Open job search →</a>
    </div>`;
  } else {
    panel.innerHTML = notes.map(n => {
      const date = new Date(n.ts);
      const timeStr = date.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
      return `<div class="inbox-item${n.read ? '' : ' inbox-item-unread'}">
        <div class="inbox-icon">✦</div>
        <div>
          <p class="inbox-title">${escapeHtml(n.title)}${n.read ? '' : ' <span class="inbox-unread-dot"></span>'}</p>
          <div class="inbox-detail">${escapeHtml(n.detail || '')}</div>
          <div class="inbox-ts">${timeStr}</div>
        </div>
      </div>`;
    }).join('');
  }
}

const NOTIF_TYPE_LABELS = {
  scan: 'New match found during a scan',
  auto_apply: 'Auto mode activity (applications and outreach)',
  outreach_sent: 'Outreach email sent',
  applications_approved: 'Applications approved',
};

function renderNotifPrefs(){
  const container = document.getElementById('notifPrefsList');
  const prefs = getNotificationPreferences();
  container.innerHTML = Object.entries(NOTIF_TYPE_LABELS).map(([type, label]) => {
    const enabled = prefs[type] !== false;
    return `<div class="notif-pref-row">
      <span class="notif-pref-label">${escapeHtml(label)}</span>
      <label class="toggle-switch">
        <input type="checkbox" data-notif-type="${type}" ${enabled ? 'checked' : ''}>
        <span class="toggle-slider"></span>
      </label>
    </div>`;
  }).join('');
  container.querySelectorAll('[data-notif-type]').forEach(input => {
    input.addEventListener('change', () => {
      updateNotificationPreference(input.dataset.notifType, input.checked);
    });
  });
}
renderNotifPrefs();

document.getElementById('clearInboxBtn').addEventListener('click', () => {
  clearNotifications();               // local first
  const session = getSession();
  const userId = session && session.user_id;
  if(userId){ apiClearNotifications(userId); }   // persist to backend
  renderInbox();
});

renderInbox();

// Backend hydration + mark-all-read. When logged in, pull the real
// notifications, render them, THEN mark all read on the backend (so
// unread highlighting is visible this visit and cleared next time,
// matching how real inboxes behave). Best-effort + async so the page
// shows local state instantly.
(async () => {
  const session = getSession();
  const userId = session && session.user_id;
  if(!userId){
    markAllNotificationsRead();  // demo path - local only
    return;
  }
  try{
    const backendNotifs = await apiListNotifications(userId);
    if(Array.isArray(backendNotifs)){
      _safeSetItem('kaidostar_notifications', JSON.stringify(backendNotifs));
      renderInbox();
    }
  }catch(e){ /* best-effort - local already rendered */ }
  // Mark read locally (for instant UI next render) and on the backend.
  markAllNotificationsRead();
  apiMarkAllNotificationsRead(userId);
})();
</script>
<script>
// Visible tier switcher (preview - no payment) so plan differences are testable everywhere.
if(typeof injectTierSwitcher === 'function'){ try{ injectTierSwitcher(); }catch(e){} }
</script>
</body>
</html>
