window.addEventListener("error", function(e){ var m="Script error: "+e.message; if(!document.getElementById("diagBanner")){var b=document.createElement("div");b.id="diagBanner";b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;padding:14px;font-family:monospace;font-size:13px;text-align:center;";b.textContent="Kaidostar failed to load - "+m;document.body.prepend(b);} });
</script>
<script>
if(typeof initStarfield==='function') initStarfield();
if(typeof _safeSetItem==='function') _safeSetItem('kaidostar_role','candidate');

MISSION.page('interviews');
</script>
