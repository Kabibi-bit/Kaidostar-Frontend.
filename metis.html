<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metis — Kaidostar</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* ===== Metis full workspace ===== */
  .mx-wrap{ max-width: 1280px; margin: 0 auto; padding: 0 18px; }
  .mx-shell{ display:grid; grid-template-columns: 288px 1fr; gap:16px;
    height: calc(100vh - 128px); min-height: 480px; }
  /* Sidebar */
  .mx-side{ background:var(--surface,#16161f); border:1px solid var(--line,#2a2a36); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden; }
  .mx-side-head{ padding:16px 16px 12px; border-bottom:1px solid var(--line,#2a2a36); }
  .mx-brand{ display:flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:18px; color:var(--text,#eee); }
  .mx-brand .mx-sub{ font-family:'Manrope',sans-serif; font-weight:500; font-size:11px; color:var(--text-faint,#778); margin-top:3px; }
  .mx-new{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; color:#0b0b0f; background:var(--gold,#F0B24E);
    border:none; border-radius:10px; padding:11px 14px; cursor:pointer; }
  .mx-new:hover{ filter:brightness(1.06); }
  .mx-tabs{ display:flex; gap:4px; padding:10px 12px 0; }
  .mx-tab{ flex:1; text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-faint,#778); background:transparent; border:1px solid transparent; border-radius:8px; padding:7px 4px; cursor:pointer; }
  .mx-tab.active{ color:var(--text,#eee); background:var(--void,#0e0e14); border-color:var(--line,#2a2a36); }
  .mx-list{ flex:1; overflow-y:auto; padding:10px 12px 14px; }
  .mx-empty{ font-family:'Manrope',sans-serif; font-size:12px; color:var(--text-faint,#778); text-align:center; padding:26px 10px; line-height:1.6; }
  .mx-item{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; cursor:pointer; margin-bottom:3px; border:1px solid transparent; }
  .mx-item:hover{ background:var(--void,#0e0e14); }
  .mx-item.active{ background:var(--void,#0e0e14); border-color:var(--line,#2a2a36); }
  .mx-item-body{ flex:1; min-width:0; }
  .mx-item-title{ font-family:'Manrope',sans-serif; font-size:13px; color:var(--text,#eee); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mx-item-meta{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint,#778); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mx-item-actions{ display:none; gap:4px; }
  .mx-item:hover .mx-item-actions{ display:flex; }
  .mx-mini{ background:transparent; border:none; color:var(--text-faint,#889); cursor:pointer; font-size:13px; padding:2px 4px; border-radius:6px; }
  .mx-mini:hover{ color:var(--text,#eee); background:var(--surface,#16161f); }
  .mx-side-foot{ padding:11px 14px; border-top:1px solid var(--line,#2a2a36); font-family:'Manrope',sans-serif; font-size:11px; color:var(--text-faint,#778); }
  .mx-side-foot a{ color:var(--comet,#8B7CF6); text-decoration:none; }
  /* Main */
  .mx-main{ background:var(--surface,#16161f); border:1px solid var(--line,#2a2a36); border-radius:16px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .mx-main-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line,#2a2a36); }
  .mx-main-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:var(--text,#eee); display:flex; align-items:center; gap:9px; min-width:0; }
  .mx-main-title .t{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mx-chip{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.04em; color:var(--comet,#8B7CF6); border:1px solid var(--line,#2a2a36); border-radius:20px; padding:3px 9px; }
  .mx-head-actions{ display:flex; gap:8px; flex:0 0 auto; }
  .mx-btn{ font-family:'Manrope',sans-serif; font-weight:600; font-size:12px; color:var(--text-dim,#aab); background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:9px; padding:8px 12px; cursor:pointer; }
  .mx-btn:hover{ color:var(--text,#eee); }
  .mx-btn.primary{ color:#0b0b0f; background:var(--gold,#F0B24E); border-color:transparent; }
  /* Chat area */
  .mx-msgs{ flex:1; overflow-y:auto; padding:22px 8%; }
  .mx-msg{ margin-bottom:20px; }
  .mx-msg-label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint,#778); margin-bottom:6px; }
  .mx-bubble{ font-family:'Manrope',sans-serif; font-size:14.5px; line-height:1.65; color:var(--text,#e8e8ef); }
  .mx-msg.user .mx-bubble{ background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:12px; padding:12px 15px; }
  .mx-bubble p{ margin:0 0 10px; } .mx-bubble p:last-child{ margin-bottom:0; }
  .mx-bubble ul{ margin:0 0 10px; padding-left:20px; } .mx-bubble li{ margin-bottom:4px; }
  .mx-bubble strong{ color:#fff; }
  .mx-bubble code{ font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:5px; padding:1px 5px; }
  .mx-greeting{ text-align:center; margin:auto; max-width:520px; color:var(--text-dim,#aab); font-family:'Manrope',sans-serif; }
  .mx-greeting h2{ font-family:'Space Grotesk',sans-serif; color:var(--text,#eee); font-size:22px; margin:0 0 8px; }
  .mx-sugg{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .mx-sugg button{ font-family:'Manrope',sans-serif; font-size:12.5px; color:var(--text-dim,#aab); background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:20px; padding:8px 14px; cursor:pointer; }
  .mx-sugg button:hover{ color:var(--text,#eee); border-color:var(--comet,#8B7CF6); }
  .mx-typing span{ display:inline-block; width:6px; height:6px; margin-right:3px; border-radius:50%; background:var(--text-faint,#778); animation:mxb 1s infinite; }
  .mx-typing span:nth-child(2){ animation-delay:.15s; } .mx-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes mxb{ 0%,60%,100%{ opacity:.3; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-3px);} }
  /* Composer */
  .mx-composer{ border-top:1px solid var(--line,#2a2a36); padding:14px 16px; }
  .mx-composer-row{ display:flex; gap:10px; align-items:flex-end; }
  .mx-composer textarea{ flex:1; resize:none; font-family:'Manrope',sans-serif; font-size:14px; color:var(--text,#eee);
    background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:12px; padding:12px 14px; max-height:160px; line-height:1.5; }
  .mx-composer textarea:focus{ outline:none; border-color:var(--comet,#8B7CF6); }
  .mx-send{ flex:0 0 auto; width:44px; height:44px; border-radius:12px; border:none; background:var(--gold,#F0B24E); color:#0b0b0f; font-size:18px; cursor:pointer; }
  .mx-send:disabled{ opacity:.5; cursor:default; }
  .mx-context-note{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint,#778); margin-top:8px; text-align:center; }
  /* Panels (project / schedule / settings) */
  .mx-panel{ flex:1; overflow-y:auto; padding:24px 7%; }
  .mx-field{ margin-bottom:18px; }
  .mx-field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint,#778); margin-bottom:7px; }
  .mx-field input[type=text], .mx-field input[type=datetime-local], .mx-field textarea, .mx-field select{
    width:100%; font-family:'Manrope',sans-serif; font-size:14px; color:var(--text,#eee); background:var(--void,#0e0e14);
    border:1px solid var(--line,#2a2a36); border-radius:10px; padding:11px 13px; }
  .mx-field textarea{ resize:vertical; min-height:96px; line-height:1.55; }
  .mx-field input:focus, .mx-field textarea:focus, .mx-field select:focus{ outline:none; border-color:var(--comet,#8B7CF6); }
  .mx-tones{ display:flex; flex-wrap:wrap; gap:8px; }
  .mx-tone{ font-family:'Manrope',sans-serif; font-size:12.5px; color:var(--text-dim,#aab); background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:20px; padding:8px 15px; cursor:pointer; }
  .mx-tone.active{ color:#0b0b0f; background:var(--gold,#F0B24E); border-color:transparent; }
  .mx-save-row{ display:flex; align-items:center; gap:12px; margin-top:6px; }
  .mx-saved-note{ font-family:'Manrope',sans-serif; font-size:12px; color:var(--aurora,#40C0A0); opacity:0; transition:opacity .3s; }
  .mx-saved-note.show{ opacity:1; }
  /* Schedule */
  .mx-sched-add{ display:grid; grid-template-columns: 1fr 200px auto; gap:10px; align-items:end; margin-bottom:20px; }
  .mx-sched-item{ display:flex; align-items:flex-start; gap:12px; padding:13px 15px; background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:11px; margin-bottom:9px; }
  .mx-sched-item.done .mx-sched-title{ text-decoration:line-through; color:var(--text-faint,#778); }
  .mx-sched-item.overdue{ border-color:rgba(214,90,90,.5); }
  .mx-check{ flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line,#3a3a46); background:transparent; cursor:pointer; margin-top:1px; color:var(--aurora,#40C0A0); font-size:13px; line-height:17px; text-align:center; }
  .mx-sched-body{ flex:1; min-width:0; }
  .mx-sched-title{ font-family:'Manrope',sans-serif; font-size:14px; color:var(--text,#eee); }
  .mx-sched-when{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--comet,#8B7CF6); margin-top:3px; }
  .mx-sched-when.overdue{ color:var(--danger,#D65A5A); }
  .mx-sched-notes{ font-family:'Manrope',sans-serif; font-size:12.5px; color:var(--text-dim,#aab); margin-top:5px; line-height:1.5; }
  .mx-section-label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint,#778); margin:6px 0 12px; }
  .mx-proj-instr{ font-family:'Manrope',sans-serif; font-size:13px; color:var(--text-dim,#aab); line-height:1.6; white-space:pre-wrap; background:var(--void,#0e0e14); border:1px solid var(--line,#2a2a36); border-radius:11px; padding:14px 16px; margin-bottom:20px; }
  @media (max-width: 860px){
    .mx-shell{ grid-template-columns: 1fr; height:auto; }
    .mx-side{ height:auto; max-height:340px; }
    .mx-main{ height: calc(100vh - 200px); min-height:460px; }
    .mx-msgs{ padding:18px 20px; } .mx-panel{ padding:20px; } .mx-sched-add{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="nebula" aria-hidden="true">
  <div class="neb neb-aurora"></div>
  <div class="neb neb-violet"></div>
  <div class="neb neb-gold"></div>
</div>
<div id="nav-root"></div>

<div class="mx-wrap">
  <div class="mx-shell">
    <!-- Sidebar -->
    <aside class="mx-side">
      <div class="mx-side-head">
        <div class="mx-brand"><span id="mxMark"></span><div><div>Metis</div><div class="mx-sub">Your AI workspace</div></div></div>
        <button class="mx-new" id="mxNew">&#43; New chat</button>
      </div>
      <div class="mx-tabs" id="mxTabs">
        <button class="mx-tab active" data-tab="chats">Chats</button>
        <button class="mx-tab" data-tab="projects">Projects</button>
        <button class="mx-tab" data-tab="schedule">Schedule</button>
        <button class="mx-tab" data-tab="settings">Customise</button>
      </div>
      <div class="mx-list" id="mxList"></div>
      <div class="mx-side-foot" id="mxFoot"></div>
    </aside>
    <!-- Main -->
    <section class="mx-main" id="mxMain"></section>
  </div>
</div>

<div id="diagRoot"></div>
<script src="api.js"></script>
<script src="state.js"></script>
<script>
window.addEventListener("error", function(e){ var m="Script error: "+e.message; if(!document.getElementById("diagBanner")){var b=document.createElement("div");b.id="diagBanner";b.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#B91C1C;color:#fff;padding:14px;font-family:monospace;font-size:13px;text-align:center;";b.textContent="Kaidostar failed to load - "+m;document.body.prepend(b);} });
</script>
<script>
if(typeof initStarfield === 'function') initStarfield();
if(typeof renderNav === 'function') renderNav('metis');
document.getElementById('mxMark').innerHTML = (typeof metisMark === 'function') ? metisMark(20, '#F0B24E') : '&#10022;';

/* =========================================================================
   METIS WORKSPACE
   Local-first: everything lives in localStorage and works fully offline; when
   signed in it mirrors to /metis (best-effort) and rehydrates on load, so a
   user's conversations, projects, schedule and customisation follow them
   across devices. The chat itself goes through the same backend /chat as the
   floating widget, but composes an extra_context from the active project, the
   user's customisation and their upcoming schedule so Metis actually works
   *in* the project and *on* the schedule.
   ========================================================================= */
(function(){
  var LS = { convos:'kaidostar_metis_conversations', projects:'kaidostar_metis_projects',
             schedule:'kaidostar_metis_schedule', settings:'kaidostar_metis_settings' };
  var KIND = { convos:'conversation', projects:'project', schedule:'schedule' };

  function uid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function now(){ return Date.now(); }
  function sess(){ try{ var s = (typeof getSession==='function') && getSession(); return s && s.user_id; }catch(e){ return null; } }
  function readLS(k, fb){ try{ var v = JSON.parse(localStorage.getItem(k)); return v==null ? fb : v; }catch(e){ return fb; } }
  function writeLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

  // --- state ---
  var convos = readLS(LS.convos, []);
  var projects = readLS(LS.projects, []);
  var schedule = readLS(LS.schedule, []);
  var settings = readLS(LS.settings, { name:'Metis', tone:'balanced', focus:'', instructions:'' });
  var tab = 'chats';
  var activeConvoId = null;
  var viewProjectId = null;    // when viewing a single project
  var sending = false;

  // --- tiny markdown ---
  function mdLite(text){
    var escaped = esc(text);
    var lines = escaped.split('\n'), html='', inList=false;
    function bold(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+?)`/g,'<code>$1</code>'); }
    lines.forEach(function(line){
      var t = bold(line.trim());
      if(/^[-*]\s+/.test(t)){ if(!inList){ html+='<ul>'; inList=true; } html += '<li>'+t.replace(/^[-*]\s+/,'')+'</li>'; }
      else { if(inList){ html+='</ul>'; inList=false; } if(t.length) html += '<p>'+t+'</p>'; }
    });
    if(inList) html+='</ul>';
    return html || '<p></p>';
  }

  // --- persistence (local + best-effort server) ---
  function persist(kind, list){ writeLS(LS[kind], list); }
  function serverSaveItem(metaKind, item){
    var u = sess(); if(!u || typeof apiMetisSave!=='function') return;
    try{ apiMetisSave(u, metaKind, item.id, item); }catch(e){}
  }
  function serverDeleteItem(metaKind, id){
    var u = sess(); if(!u || typeof apiMetisDelete!=='function') return;
    try{ apiMetisDelete(u, id, metaKind); }catch(e){}
  }
  function serverSaveSettings(){
    var u = sess(); if(!u || typeof apiMetisSetSingleton!=='function') return;
    try{ apiMetisSetSingleton(u, 'settings', settings); }catch(e){}
  }

  // Rehydrate from server, merging by id (newer updated_at wins), pushing local-only up.
  async function hydrate(){
    var u = sess(); if(!u || typeof apiMetisList!=='function') return false;
    var changed = false;
    async function mergeKind(mapKey, metaKind, getList, setList){
      var server = await apiMetisList(u, metaKind);
      if(server===null) return; // offline / error: keep local
      var local = getList();
      var byId = {};
      local.forEach(function(it){ if(it && it.id) byId[it.id] = it; });
      server.forEach(function(row){
        var d = row.data || {}; if(!d.id) d.id = row.id;
        var ex = byId[d.id];
        if(!ex || (Number(d.updated_at||0) >= Number(ex.updated_at||0))) byId[d.id] = d;
      });
      var merged = Object.keys(byId).map(function(k){ return byId[k]; });
      // push local-only items (present locally, absent on server) up
      var serverIds = {}; server.forEach(function(r){ serverIds[(r.data&&r.data.id)||r.id]=1; });
      local.forEach(function(it){ if(it && it.id && !serverIds[it.id]) serverSaveItem(metaKind, it); });
      setList(merged); changed = true;
    }
    try{
      await mergeKind('convos', 'conversation', function(){return convos;}, function(m){ convos=m; persist('convos',convos); });
      await mergeKind('projects','project', function(){return projects;}, function(m){ projects=m; persist('projects',projects); });
      await mergeKind('schedule','schedule', function(){return schedule;}, function(m){ schedule=m; persist('schedule',schedule); });
      var s = await apiMetisList(u,'settings');
      if(s && s.length){ var sd = s[0].data||{}; if(sd && (sd.name||sd.tone||sd.focus||sd.instructions)){ settings = Object.assign(settings, sd); writeLS(LS.settings, settings); changed=true; } }
    }catch(e){}
    return changed;
  }

  // --- conversation helpers ---
  function convoById(id){ return convos.find(function(c){ return c.id===id; }) || null; }
  function projectById(id){ return projects.find(function(p){ return p.id===id; }) || null; }
  function saveConvo(c){ c.updated_at = now(); var i = convos.findIndex(function(x){return x.id===c.id;});
    if(i>=0) convos[i]=c; else convos.unshift(c); persist('convos', convos); serverSaveItem('conversation', c); }
  function newChat(projectId){
    var c = { id: uid(), title:'New chat', project_id: projectId||null, messages:[], created_at: now(), updated_at: now() };
    convos.unshift(c); persist('convos', convos); activeConvoId = c.id; tab='chats'; render(); focusComposer();
  }
  function deleteConvo(id){ convos = convos.filter(function(c){return c.id!==id;}); persist('convos',convos); serverDeleteItem('conversation', id);
    if(activeConvoId===id) activeConvoId = null; render(); }
  function renameConvo(id){ var c=convoById(id); if(!c) return; var t = prompt('Rename this chat', c.title||'New chat'); if(t==null) return; c.title=(t.trim()||c.title); saveConvo(c); render(); }

  function newProject(){
    var name = prompt('Project name (e.g. "Summer 2026 internships", "Grad school apps")'); if(name==null) return;
    name = name.trim(); if(!name) return;
    var p = { id: uid(), name:name, instructions:'', created_at: now(), updated_at: now() };
    projects.unshift(p); persist('projects', projects); serverSaveItem('project', p);
    tab='projects'; viewProjectId = p.id; render();
  }
  function saveProject(p){ p.updated_at = now(); var i=projects.findIndex(function(x){return x.id===p.id;}); if(i>=0) projects[i]=p; else projects.unshift(p); persist('projects',projects); serverSaveItem('project', p); }
  function deleteProject(id){ projects = projects.filter(function(p){return p.id!==id;}); persist('projects',projects); serverDeleteItem('project', id);
    // orphan its conversations (keep them, just unlink)
    convos.forEach(function(c){ if(c.project_id===id){ c.project_id=null; saveConvo(c); } });
    if(viewProjectId===id) viewProjectId=null; render(); }

  function addSchedule(title, when, notes){
    var item = { id: uid(), title:title, when:when||'', notes:notes||'', done:false, created_at: now(), updated_at: now() };
    schedule.unshift(item); persist('schedule', schedule); serverSaveItem('schedule', item); render();
  }
  function toggleSchedule(id){ var it=schedule.find(function(s){return s.id===id;}); if(!it) return; it.done=!it.done; it.updated_at=now(); persist('schedule',schedule); serverSaveItem('schedule', it); render(); }
  function deleteSchedule(id){ schedule = schedule.filter(function(s){return s.id!==id;}); persist('schedule',schedule); serverDeleteItem('schedule', id); render(); }

  function saveSettings(){ writeLS(LS.settings, settings); serverSaveSettings(); }

  // --- compose the extra system context from the user's own workspace ---
  function toneLine(){
    var map = { balanced:'', direct:'Be direct and decisive - lead with the answer, cut throat-clearing.',
      encouraging:'Be warm and encouraging while staying honest.', socratic:'Coach with a few sharp questions before giving your take.',
      concise:'Be very concise - short answers, minimal preamble.' };
    return map[settings.tone] || '';
  }
  function upcomingScheduleText(){
    var live = schedule.filter(function(s){ return !s.done; }).slice(0, 12);
    if(!live.length) return '';
    live.sort(function(a,b){ return String(a.when||'').localeCompare(String(b.when||'')); });
    return live.map(function(s){ return '- ' + s.title + (s.when? (' (' + s.when + ')') : '') + (s.notes? (' - ' + s.notes) : ''); }).join('\n');
  }
  function composeExtraContext(convo){
    var parts = [];
    var name = (settings.name||'Metis').trim();
    if(name && name.toLowerCase()!=='metis') parts.push('The user calls you "' + name + '".');
    var tl = toneLine(); if(tl) parts.push(tl);
    if(settings.focus && settings.focus.trim()) parts.push('The user\'s current focus: ' + settings.focus.trim());
    if(settings.instructions && settings.instructions.trim()) parts.push('The user\'s standing instructions for you: ' + settings.instructions.trim());
    if(convo && convo.project_id){ var p = projectById(convo.project_id);
      if(p){ parts.push('You are working inside the project "' + p.name + '".');
        if(p.instructions && p.instructions.trim()) parts.push('Project instructions: ' + p.instructions.trim()); } }
    var sched = upcomingScheduleText();
    if(sched) parts.push('The user\'s upcoming schedule/tasks:\n' + sched);
    return parts.join('\n').slice(0, 5800);
  }

  // ===================== RENDER =====================
  function setTab(t){ tab=t; if(t!=='projects') viewProjectId=null; render(); }

  function render(){ renderTabs(); renderList(); renderMain(); renderFoot(); }

  function renderTabs(){
    document.querySelectorAll('#mxTabs .mx-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===tab); });
  }
  function renderFoot(){
    var foot = document.getElementById('mxFoot');
    if(sess()) foot.innerHTML = 'Synced to your account across devices.';
    else foot.innerHTML = 'Working offline. <a href="login.html">Sign in</a> to sync & save.';
  }

  function fmtWhen(w){ if(!w) return ''; try{ var d=new Date(w); if(!isNaN(d)) return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){} return w; }
  function isOverdue(s){ if(s.done||!s.when) return false; try{ var d=new Date(s.when); return !isNaN(d) && d.getTime() < now(); }catch(e){ return false; } }

  function renderList(){
    var el = document.getElementById('mxList');
    if(tab==='chats'){
      if(!convos.length){ el.innerHTML = '<div class="mx-empty">No saved chats yet.<br>Start one with <b>New chat</b> - every conversation is saved here automatically.</div>'; return; }
      el.innerHTML = convos.slice().sort(function(a,b){return (b.updated_at||0)-(a.updated_at||0);}).map(function(c){
        var proj = c.project_id ? projectById(c.project_id) : null;
        var meta = (proj? (proj.name+' · ') : '') + (c.messages && c.messages.length ? (Math.ceil(c.messages.length/2)+' turns') : 'empty');
        return '<div class="mx-item'+(c.id===activeConvoId?' active':'')+'" data-open="'+c.id+'">'
          + '<div class="mx-item-body"><div class="mx-item-title">'+esc(c.title||'New chat')+'</div><div class="mx-item-meta">'+esc(meta)+'</div></div>'
          + '<div class="mx-item-actions"><button class="mx-mini" data-rename="'+c.id+'" title="Rename">&#9998;</button><button class="mx-mini" data-delc="'+c.id+'" title="Delete">&#215;</button></div></div>';
      }).join('');
    } else if(tab==='projects'){
      var head = '<button class="mx-new" id="mxNewProj" style="margin:0 0 12px;">&#43; New project</button>';
      if(!projects.length){ el.innerHTML = head + '<div class="mx-empty">No projects yet.<br>A project keeps related chats together and gives Metis standing instructions for that goal.</div>'; wireProjBtn(); return; }
      el.innerHTML = head + projects.map(function(p){
        var count = convos.filter(function(c){return c.project_id===p.id;}).length;
        return '<div class="mx-item'+(p.id===viewProjectId?' active':'')+'" data-proj="'+p.id+'">'
          + '<div class="mx-item-body"><div class="mx-item-title">'+esc(p.name)+'</div><div class="mx-item-meta">'+count+' chat'+(count===1?'':'s')+'</div></div>'
          + '<div class="mx-item-actions"><button class="mx-mini" data-delp="'+p.id+'" title="Delete">&#215;</button></div></div>';
      }).join('');
      wireProjBtn();
    } else if(tab==='schedule'){
      var live = schedule.filter(function(s){return !s.done;}).length, done = schedule.length-live;
      el.innerHTML = '<div class="mx-empty" style="padding:16px 8px;text-align:left;line-height:1.7;">'
        + '<b style="color:var(--text,#eee);">'+live+'</b> open · <b>'+done+'</b> done<br>'
        + 'Track deadlines and to-dos here. Metis sees your open items and can plan around them.</div>';
    } else {
      el.innerHTML = '<div class="mx-empty" style="text-align:left;line-height:1.7;padding:16px 8px;">Make Metis yours - a name, a tone, a focus and standing instructions it follows in every chat.</div>';
    }
  }
  function wireProjBtn(){ var b=document.getElementById('mxNewProj'); if(b) b.addEventListener('click', newProject); }

  function renderMain(){
    var main = document.getElementById('mxMain');
    if(tab==='schedule'){ main.innerHTML = scheduleView(); wireSchedule(); return; }
    if(tab==='settings'){ main.innerHTML = settingsView(); wireSettings(); return; }
    if(tab==='projects' && viewProjectId){ main.innerHTML = projectView(); wireProjectView(); return; }
    if(tab==='projects' && !viewProjectId){ main.innerHTML = projectsIntro(); return; }
    // chat view
    main.innerHTML = chatView(); wireChat();
  }

  function chatView(){
    var c = convoById(activeConvoId);
    var proj = c && c.project_id ? projectById(c.project_id) : null;
    var head = '<div class="mx-main-head"><div class="mx-main-title">'
      + '<span class="t">'+esc(c? (c.title||'New chat') : 'New chat')+'</span>'
      + (proj? '<span class="mx-chip">'+esc(proj.name)+'</span>' : '')
      + '</div><div class="mx-head-actions">'
      + (c? '<button class="mx-btn" id="mxRename">Rename</button>' : '')
      + '</div></div>';
    var body;
    if(!c || !c.messages.length){
      var nm = esc((settings.name||'Metis'));
      body = '<div class="mx-msgs" id="mxMsgs"><div class="mx-greeting"><h2>'+nm+' is ready.</h2>'
        + '<p>Ask about your matches, applications, a roadmap, an essay - anything. This chat saves automatically, and you can group it into a project or point Metis at your schedule.</p>'
        + '<div class="mx-sugg">'
        + '<button data-q="Which of my current matches should I prioritise this week?">Prioritise my matches</button>'
        + '<button data-q="Draft a cold outreach email for my top match.">Draft cold outreach</button>'
        + '<button data-q="Look at my schedule and tell me what to do first.">Plan around my schedule</button>'
        + '</div></div></div>';
    } else {
      body = '<div class="mx-msgs" id="mxMsgs">' + c.messages.map(function(m){
        return '<div class="mx-msg '+(m.role==='user'?'user':'assistant')+'"><div class="mx-msg-label">'+(m.role==='user'?'You':esc(settings.name||'Metis'))+'</div><div class="mx-bubble">'+mdLite(m.content)+'</div></div>';
      }).join('') + '</div>';
    }
    var ctxNote = '';
    var cc = c || {project_id:null};
    var bits=[]; if(cc.project_id){ var p=projectById(cc.project_id); if(p) bits.push('project: '+p.name); }
    if(settings.tone && settings.tone!=='balanced') bits.push(settings.tone);
    if(schedule.filter(function(s){return !s.done;}).length) bits.push('schedule-aware');
    if(bits.length) ctxNote = '<div class="mx-context-note">Metis is using — '+esc(bits.join(' · '))+'</div>';
    var composer = '<div class="mx-composer"><div class="mx-composer-row">'
      + '<textarea id="mxInput" rows="1" placeholder="Message Metis…"></textarea>'
      + '<button class="mx-send" id="mxSend" aria-label="Send">&#10148;</button></div>'+ctxNote+'</div>';
    return head + body + composer;
  }

  function wireChat(){
    var input = document.getElementById('mxInput'), send = document.getElementById('mxSend');
    var rename = document.getElementById('mxRename'); if(rename) rename.addEventListener('click', function(){ renameConvo(activeConvoId); });
    document.querySelectorAll('#mxMsgs .mx-sugg button').forEach(function(b){ b.addEventListener('click', function(){ input.value=b.dataset.q; sendMessage(); }); });
    if(input){
      input.addEventListener('input', function(){ input.style.height='auto'; input.style.height=Math.min(160,input.scrollHeight)+'px'; });
      input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
    }
    if(send) send.addEventListener('click', sendMessage);
  }
  function focusComposer(){ setTimeout(function(){ var i=document.getElementById('mxInput'); if(i) i.focus(); }, 30); }

  function appendMsgDom(role, html){
    var msgs=document.getElementById('mxMsgs'); if(!msgs) return null;
    var greet = msgs.querySelector('.mx-greeting'); if(greet) msgs.innerHTML='';
    var w=document.createElement('div'); w.className='mx-msg '+(role==='user'?'user':'assistant');
    w.innerHTML='<div class="mx-msg-label">'+(role==='user'?'You':esc(settings.name||'Metis'))+'</div><div class="mx-bubble">'+html+'</div>';
    msgs.appendChild(w); msgs.scrollTop=msgs.scrollHeight; return w;
  }

  async function sendMessage(){
    if(sending) return;
    var input=document.getElementById('mxInput'); if(!input) return;
    var text=input.value.trim(); if(!text) return;
    // ensure there is an active conversation
    var c = convoById(activeConvoId);
    if(!c){ c={ id:uid(), title:'New chat', project_id:(tab==='projects'&&viewProjectId)?viewProjectId:null, messages:[], created_at:now(), updated_at:now() }; convos.unshift(c); activeConvoId=c.id; }
    input.value=''; input.style.height='auto'; sending=true;
    var sendBtn=document.getElementById('mxSend'); if(sendBtn) sendBtn.disabled=true;
    appendMsgDom('user', mdLite(text));
    c.messages.push({role:'user', content:text});
    if(c.title==='New chat'){ c.title = text.length>42 ? (text.slice(0,42)+'…') : text; }
    saveConvo(c); renderList();
    // typing indicator
    var typing = appendMsgDom('assistant', '<span class="mx-typing"><span></span><span></span><span></span></span>');
    try{
      var reply='';
      var u=sess();
      var prior = c.messages.slice(0,-1); var priorForApi = prior.length>20 ? prior.slice(-20) : prior;
      var extra = composeExtraContext(c);
      if(u && typeof apiChat==='function'){
        var res = await apiChat(u, text, priorForApi, extra);
        if(res.ok && res.reply) reply=res.reply;
      }
      if(!reply){
        // logged-out / fallback: direct call with a composed system prompt
        var sys = 'You are Metis, the AI guide inside Kaidostar, a career/college opportunity app. Be concise, practical and honest.';
        if(extra) sys += '\n\n' + extra;
        var histForApi = c.messages.length>20 ? c.messages.slice(-20) : c.messages.slice();
        var response = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, system:sys, messages:histForApi }) });
        var data = await response.json();
        reply = (data.content||[]).map(function(b){ return b.type==='text'?b.text:''; }).filter(Boolean).join('\n');
      }
      if(typing) typing.remove();
      if(!reply) throw new Error('empty');
      appendMsgDom('assistant', mdLite(reply));
      c.messages.push({role:'assistant', content:reply});
      saveConvo(c); renderList();
    }catch(err){
      if(typing) typing.remove();
      appendMsgDom('assistant', mdLite("Something went wrong reaching me just now - mind trying again?"));
      console.error('Metis chat error:', err);
    }finally{ sending=false; var sb=document.getElementById('mxSend'); if(sb) sb.disabled=false; focusComposer(); }
  }

  // ---- projects ----
  function projectsIntro(){
    return '<div class="mx-main-head"><div class="mx-main-title"><span class="t">Projects</span></div></div>'
      + '<div class="mx-panel"><div class="mx-greeting" style="margin-top:40px;"><h2>Work in projects</h2>'
      + '<p>Group related chats and give Metis a standing brief for a goal - "Summer 2026 internships", "Transfer applications", "First 90 days". Every chat in a project inherits its instructions, so Metis stays on-task without you repeating yourself.</p>'
      + '<div class="mx-sugg"><button id="mxIntroNewProj">&#43; New project</button></div></div></div>';
  }
  function projectView(){
    var p = projectById(viewProjectId); if(!p) return projectsIntro();
    var chats = convos.filter(function(c){return c.project_id===p.id;}).sort(function(a,b){return (b.updated_at||0)-(a.updated_at||0);});
    var chatList = chats.length ? chats.map(function(c){
      return '<div class="mx-sched-item" data-openc="'+c.id+'" style="cursor:pointer;"><div class="mx-sched-body"><div class="mx-sched-title">'+esc(c.title||'New chat')+'</div><div class="mx-sched-when" style="color:var(--text-faint,#778);">'+ (c.messages?Math.ceil(c.messages.length/2):0) +' turns</div></div></div>';
    }).join('') : '<div class="mx-empty" style="text-align:left;">No chats in this project yet.</div>';
    return '<div class="mx-main-head"><div class="mx-main-title"><span class="t">'+esc(p.name)+'</span><span class="mx-chip">project</span></div>'
      + '<div class="mx-head-actions"><button class="mx-btn primary" id="mxProjNewChat">&#43; New chat in project</button><button class="mx-btn" id="mxProjDelete">Delete</button></div></div>'
      + '<div class="mx-panel">'
      + '<div class="mx-field"><label>Project name</label><input type="text" id="mxProjName" value="'+esc(p.name)+'"></div>'
      + '<div class="mx-field"><label>Standing instructions — Metis follows these in every chat in this project</label>'
      + '<textarea id="mxProjInstr" placeholder="e.g. I\'m targeting data-focused PM roles at Series A–C startups. Prioritise fit over prestige, keep outreach warm but brief, and always tie advice back to my SQL + experimentation background.">'+esc(p.instructions||'')+'</textarea></div>'
      + '<div class="mx-save-row"><button class="mx-btn primary" id="mxProjSave">Save project</button><span class="mx-saved-note" id="mxProjSaved">Saved</span></div>'
      + '<div class="mx-section-label" style="margin-top:26px;">Chats in this project</div>'+chatList
      + '</div>';
  }
  function wireProjectView(){
    var p = projectById(viewProjectId); if(!p) return;
    var save=document.getElementById('mxProjSave');
    if(save) save.addEventListener('click', function(){ p.name=(document.getElementById('mxProjName').value.trim()||p.name); p.instructions=document.getElementById('mxProjInstr').value; saveProject(p); flash('mxProjSaved'); renderList(); var t=document.querySelector('.mx-main-title .t'); if(t) t.textContent=p.name; });
    var nc=document.getElementById('mxProjNewChat'); if(nc) nc.addEventListener('click', function(){ newChat(p.id); });
    var del=document.getElementById('mxProjDelete'); if(del) del.addEventListener('click', function(){ if(confirm('Delete this project? Its chats are kept but unlinked.')) deleteProject(p.id); });
    document.querySelectorAll('[data-openc]').forEach(function(row){ row.addEventListener('click', function(){ activeConvoId=row.dataset.openc; tab='chats'; render(); }); });
  }

  // ---- schedule ----
  function scheduleView(){
    var items = schedule.slice().sort(function(a,b){
      if(a.done!==b.done) return a.done?1:-1;
      return String(a.when||'~').localeCompare(String(b.when||'~'));
    });
    var list = items.length ? items.map(function(s){
      var ov = isOverdue(s);
      return '<div class="mx-sched-item'+(s.done?' done':'')+(ov?' overdue':'')+'">'
        + '<button class="mx-check" data-toggle="'+s.id+'">'+(s.done?'&#10003;':'')+'</button>'
        + '<div class="mx-sched-body"><div class="mx-sched-title">'+esc(s.title)+'</div>'
        + (s.when? '<div class="mx-sched-when'+(ov?' overdue':'')+'">'+esc(fmtWhen(s.when))+(ov?' · overdue':'')+'</div>':'')
        + (s.notes? '<div class="mx-sched-notes">'+esc(s.notes)+'</div>':'')
        + '</div><button class="mx-mini" data-dels="'+s.id+'" title="Delete">&#215;</button></div>';
    }).join('') : '<div class="mx-empty" style="text-align:left;">Nothing scheduled yet. Add a deadline or to-do above — Metis will factor open items into its advice.</div>';
    return '<div class="mx-main-head"><div class="mx-main-title"><span class="t">Schedule</span></div>'
      + '<div class="mx-head-actions"><button class="mx-btn primary" id="mxPlan">Ask Metis to plan</button></div></div>'
      + '<div class="mx-panel">'
      + '<div class="mx-sched-add">'
      + '<div class="mx-field" style="margin:0;"><label>Task or deadline</label><input type="text" id="mxSchTitle" placeholder="e.g. Submit Fernway Labs application"></div>'
      + '<div class="mx-field" style="margin:0;"><label>When</label><input type="datetime-local" id="mxSchWhen"></div>'
      + '<button class="mx-btn primary" id="mxSchAdd" style="height:42px;">Add</button>'
      + '</div>'
      + '<div class="mx-field"><label>Notes (optional)</label><input type="text" id="mxSchNotes" placeholder="Anything Metis should know about this item"></div>'
      + '<div class="mx-section-label" style="margin-top:12px;">Your items</div>'+list
      + '</div>';
  }
  function wireSchedule(){
    var add=document.getElementById('mxSchAdd');
    if(add) add.addEventListener('click', function(){
      var t=document.getElementById('mxSchTitle').value.trim(); if(!t) return;
      addSchedule(t, document.getElementById('mxSchWhen').value, document.getElementById('mxSchNotes').value.trim());
    });
    document.querySelectorAll('[data-toggle]').forEach(function(b){ b.addEventListener('click', function(){ toggleSchedule(b.dataset.toggle); }); });
    document.querySelectorAll('[data-dels]').forEach(function(b){ b.addEventListener('click', function(){ deleteSchedule(b.dataset.dels); }); });
    var plan=document.getElementById('mxPlan'); if(plan) plan.addEventListener('click', planSchedule);
  }
  function planSchedule(){
    var open = schedule.filter(function(s){return !s.done;});
    if(!open.length){ alert('Add a few open items first, then Metis can plan them.'); return; }
    newChat(null);
    var c = convoById(activeConvoId); c.title='Plan my schedule'; saveConvo(c);
    var i=document.getElementById('mxInput'); if(i){ i.value='Here is my current schedule. Prioritise it and tell me what to do first, flag anything at risk, and suggest an order for the week.'; sendMessage(); }
  }

  // ---- settings ----
  function settingsView(){
    var tones=[['balanced','Balanced'],['direct','Direct'],['encouraging','Encouraging'],['socratic','Socratic'],['concise','Concise']];
    return '<div class="mx-main-head"><div class="mx-main-title"><span class="t">Customise Metis</span></div></div>'
      + '<div class="mx-panel">'
      + '<div class="mx-field"><label>What should Metis be called?</label><input type="text" id="mxSetName" value="'+esc(settings.name||'Metis')+'" placeholder="Metis"></div>'
      + '<div class="mx-field"><label>Tone</label><div class="mx-tones" id="mxTones">'
      + tones.map(function(t){ return '<button class="mx-tone'+(settings.tone===t[0]?' active':'')+'" data-tone="'+t[0]+'">'+t[1]+'</button>'; }).join('')
      + '</div></div>'
      + '<div class="mx-field"><label>Your current focus (optional)</label><input type="text" id="mxSetFocus" value="'+esc(settings.focus||'')+'" placeholder="e.g. Breaking into product management at a data company"></div>'
      + '<div class="mx-field"><label>Standing instructions — Metis follows these in every chat</label><textarea id="mxSetInstr" placeholder="e.g. Always tie advice back to my SQL + stakeholder background. Keep outreach drafts under 120 words. Push me when I\'m avoiding the hard task.">'+esc(settings.instructions||'')+'</textarea></div>'
      + '<div class="mx-save-row"><button class="mx-btn primary" id="mxSetSave">Save customisation</button><span class="mx-saved-note" id="mxSetSaved">Saved</span></div>'
      + '</div>';
  }
  function wireSettings(){
    document.querySelectorAll('#mxTones .mx-tone').forEach(function(b){ b.addEventListener('click', function(){ settings.tone=b.dataset.tone; document.querySelectorAll('#mxTones .mx-tone').forEach(function(x){x.classList.toggle('active', x===b);}); }); });
    var save=document.getElementById('mxSetSave');
    if(save) save.addEventListener('click', function(){
      settings.name=(document.getElementById('mxSetName').value.trim()||'Metis');
      settings.focus=document.getElementById('mxSetFocus').value.trim();
      settings.instructions=document.getElementById('mxSetInstr').value;
      saveSettings(); flash('mxSetSaved');
    });
  }
  function flash(id){ var e=document.getElementById(id); if(!e) return; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 1600); }

  // ---- top-level wiring ----
  document.getElementById('mxNew').addEventListener('click', function(){ newChat((tab==='projects'&&viewProjectId)?viewProjectId:null); });
  document.querySelectorAll('#mxTabs .mx-tab').forEach(function(b){ b.addEventListener('click', function(){ setTab(b.dataset.tab); }); });
  document.getElementById('mxList').addEventListener('click', function(e){
    var open=e.target.closest('[data-open]'); if(open){ activeConvoId=open.getAttribute('data-open'); tab='chats'; render(); return; }
    var proj=e.target.closest('[data-proj]'); if(proj){ viewProjectId=proj.getAttribute('data-proj'); tab='projects'; render(); return; }
    var rn=e.target.closest('[data-rename]'); if(rn){ e.stopPropagation(); renameConvo(rn.getAttribute('data-rename')); return; }
    var dc=e.target.closest('[data-delc]'); if(dc){ e.stopPropagation(); if(confirm('Delete this chat?')) deleteConvo(dc.getAttribute('data-delc')); return; }
    var dp=e.target.closest('[data-delp]'); if(dp){ e.stopPropagation(); if(confirm('Delete this project? Its chats are kept but unlinked.')) deleteProject(dp.getAttribute('data-delp')); return; }
  });
  // intro "new project" (delegated because it's re-rendered)
  document.getElementById('mxMain').addEventListener('click', function(e){ if(e.target && e.target.id==='mxIntroNewProj') newProject(); });

  // open a specific convo / project / view from the URL (widget deep-links here)
  function applyHash(){
    var h=(location.hash||'').replace('#',''); if(!h) return;
    if(h==='new'){ newChat(null); return; }
    if(h==='schedule'||h==='projects'||h==='settings'){ setTab(h); return; }
    if(h.indexOf('c=')===0){ var id=h.slice(2); if(convoById(id)){ activeConvoId=id; tab='chats'; } }
  }

  // initial render, then hydrate from server and re-render
  render();
  applyHash();
  render();
  hydrate().then(function(changed){ if(changed) render(); });
})();
</script>
